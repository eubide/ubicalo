version: '3'

tasks:
  default:
    desc: Lista las tareas disponibles
    cmds:
      - task --list

  instalar:
    desc: Instala las dependencias
    cmds:
      - npm install

  dev:
    desc: Arranca la app en desarrollo; en el móvil abre la URL Network
    cmds:
      - npm run dev

  dev:https:
    desc: Arranca la app con HTTPS autofirmado para probar en el iPhone
    env:
      UBICALO_HTTPS: '1'
    cmds:
      - npx vite

  test:
    desc: Ejecuta los tests una vez
    cmds:
      - npx vitest run

  test:vigilar:
    desc: Ejecuta los tests y los repite al guardar
    cmds:
      - npx vitest

  check:
    desc: Comprueba tipos de TypeScript y Svelte
    cmds:
      - npm run check

  build:
    desc: Compila la app para producción en dist/
    cmds:
      - npm run build

  preview:
    desc: Compila y sirve la versión de producción en la red local
    cmds:
      - task: build
      - npx vite preview --host

  verificar:
    desc: Tests, tipos y compilación, como antes de un merge
    cmds:
      - task: test
      - task: check
      - task: build
      - rm -rf dist

  deploy:
    desc: Publica origin/main en GitHub Pages y espera a que termine
    cmds:
      - gh workflow run pages.yml --ref main
      # gh workflow run no devuelve el id de la ejecución que crea.
      - sleep 5
      - gh run watch --exit-status $(gh run list --workflow=pages.yml --limit 1 --json databaseId --jq '.[0].databaseId')
      - echo https://eubide.github.io/ubicalo/

  datos:contexto:
    desc: Regenera los países del contexto geográfico desde world-atlas
    cmds:
      - npm run datos:contexto

  datos:relieve:
    desc: Regenera cordilleras, sierras y picos desde el IGN
    cmds:
      - npm run datos:relieve

  datos:hidrografia:
    desc: Regenera los ríos y las vertientes desde el IGN
    cmds:
      - npm run datos:hidrografia

  datos:costas:
    desc: Regenera los cabos y golfos desde el IGN, y los tramos de costa
    cmds:
      - npm run datos:costas

  limpiar:
    desc: Borra la compilación y la caché de Vite
    cmds:
      - rm -rf dist node_modules/.vite
